[project]
name = "django-base-project"
version = "0.1.0"
description = "Inferencia Django base template"
requires-python = ">=3.13"
dependencies = [
    "dj-rest-auth[with_social]",
    "Django",
    "django-cors-headers",
    "django-debug-toolbar",
    "django-environ",
    "django-extensions",
    "django-filter",
    "django-storages[s3]",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "drf-spectacular[sidecar]",
    "drf-writable-nested",
    "gunicorn",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.1.8",
    "sentry-sdk",
    "split-settings",
    "whitenoise",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest-cov",
    "pytest-django",
]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "migrations",
    "static",
    "media",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "C4",   # comprehensions
    "SIM",  # simplifications
    "PLC0415",  # imports fuera del top-level del archivo (ver conventions.md → code organization)
]
ignore = [
    "E501",   # line too long (lo maneja el formatter)
    "B008",   # function calls in default args (patrones Django)
    "DJ001",  # Nullable CharField (criterio del dev)
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E", "F", "I", "UP"]
"**/settings/*.py"   = ["F401", "F403", "F405"]
"manage.py"          = ["E402", "PLC0415"]
"**/tasks.py"        = ["PLC0415"]  # Celery: importar modelos/servicios dentro del task es el patrón correcto

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------- Pytest ----------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_base.settings"
python_files = ["test_*.py", "tests.py", "*_tests.py"]
addopts = "--reuse-db --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------- Coverage ----------
[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "django_base/wsgi.py",
    "django_base/asgi.py",
    "*/settings/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
