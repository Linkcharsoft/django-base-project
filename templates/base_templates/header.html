{% comment %}
Banner row. `banner_url` comes from get_default_for_email_template(); when it is empty the
card still opens with a branded bar instead of a broken image placeholder.
{% endcomment %}
{% if banner_url %}
<tr>
    <td style="padding:0; font-size:0; line-height:0;">
        <img src="{{ banner_url }}" alt="{{ site_name }}" width="600"
             style="display:block; width:100%; max-width:600px; height:auto; border:0; outline:none; text-decoration:none;">
    </td>
</tr>
{% else %}
<tr>
    <td align="center"
        style="padding:28px 40px; background-color:#111111; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; font-size:22px; font-weight:bold; letter-spacing:.08em; color:#ffffff; text-transform:uppercase;">
        {{ site_name }}
    </td>
</tr>
{% endif %}
