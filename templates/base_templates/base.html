<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title>{{ site_name }}</title>
    <!--[if mso]>
    <style>
        body, table, td, p, a { font-family: Arial, sans-serif !important; }
    </style>
    <![endif]-->
    <style>
        /* Progressive enhancement only. Every style that matters is inlined below, because
           Gmail and Outlook drop most of this block. */
        @media only screen and (max-width: 620px) {
            .gx-card { width: 100% !important; }
            .gx-inner { padding: 28px 22px !important; }
            .gx-button a { display: block !important; text-align: center !important; }
        }
        a { color: #1a1a1a; }
    </style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#f4f2ef; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
    {% if preheader %}
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
        {{ preheader }}&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;
    </div>
    {% endif %}
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
           style="border-collapse:collapse; background-color:#f4f2ef;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
                       class="gx-card"
                       style="border-collapse:separate; width:600px; max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(17,17,17,.06);">
                    {% include "base_templates/header.html" %}
                    <tr>
                        <td class="gx-inner"
                            style="padding:36px 40px 12px 40px; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; font-size:16px; line-height:1.6; color:#2b2b2b;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    {% include "base_templates/footer.html" %}
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
