<tr>
    <td class="gx-inner" style="padding:8px 40px 36px 40px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
               style="border-collapse:collapse;">
            <tr>
                <td style="padding:0 0 20px 0;">
                    <div style="height:1px; line-height:1px; font-size:0; background-color:#eceae6;">&nbsp;</div>
                </td>
            </tr>
            <tr>
                <td align="center"
                    style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; font-size:12px; line-height:1.6; color:#8b8b8b;">
                    {% if contact_email %}
                    &iquest;Dudas? Escribinos a
                    <a href="mailto:{{ contact_email }}" style="color:#8b8b8b; text-decoration:underline;">{{ contact_email }}</a>.<br>
                    {% endif %}
                    &copy; {{ year }} {{ site_name }}
                </td>
            </tr>
        </table>
    </td>
</tr>
