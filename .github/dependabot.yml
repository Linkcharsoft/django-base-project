version: 2

# Every Dependabot PR is reviewed by the shared workflow (the `dependabot` job
# of `workflows/ci.yml`), which squash-merges patch/minor bumps that pass the
# review and CI. Majors go to the panel's runner, which tests and merges them.

updates:
  # ---------- Python (uv.lock + pyproject.toml) ----------
  - package-ecosystem: uv
    directory: "/"
    # Monthly, not weekly: every bump PR runs CI, the review and a deploy, all
    # against the org's Actions minutes. Security updates ignore this schedule.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "[FIX]"
      prefix-development: "[FIX]"
    groups:
      # One PR for every patch/minor bump: CI green + review ok -> merged by
      # the `dependabot` job of workflows/ci.yml. Keeping them grouped is what
      # stops Dependabot from opening five separate PRs every Monday.
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Majors stay ungrouped and arrive one per PR: the review does not merge
      # them, the panel's runner tests each one and merges it, so batching them
      # would defeat the point.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------- GitHub Actions used by the workflows ----------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "[FIX]"
    groups:
      actions:
        patterns:
          - "*"

  # ---------- Base image of the Dockerfile ----------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "[FIX]"
    ignore:
      # `python:3.14-slim-bookworm` → `3.15-slim-bookworm` reads as a minor and would
      # auto-merge, while CI tests on 3.14. Moving Python is a deliberate change
      # (Dockerfile, ci.yml and requires-python together), not a bump.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
