version: 2

updates:
  # ---------- Python (uv.lock + pyproject.toml) ----------
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "[FIX]"
      prefix-development: "[FIX]"
    groups:
      # One PR for every patch/minor bump. These are the ones that should be
      # boring to merge: CI green -> merge. Keeping them grouped is what stops
      # Dependabot from opening five separate PRs every Monday.
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Majors stay ungrouped and arrive one per PR — they need the changelog
      # read before merging, so batching them would defeat the point.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------- GitHub Actions used by the workflows ----------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "[FIX]"
    groups:
      actions:
        patterns:
          - "*"

  # ---------- Base image of the Dockerfile ----------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "[FIX]"
